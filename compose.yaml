services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restos
      POSTGRES_USER: restos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-restos}
    volumes:
      - restos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restos -d restos"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/restos
      DB_USERNAME: restos
      DB_PASSWORD: ${DB_PASSWORD:-restos}
      JWT_SECRET: ${JWT_SECRET:-restos-development-secret-change-me-now}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8081}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}
      SESSION_INACTIVITY_MINUTES: ${SESSION_INACTIVITY_MINUTES:-120}
      LAST_GUEST_GRACE_MINUTES: ${LAST_GUEST_GRACE_MINUTES:-5}
      SESSION_STALE_REVIEW_HOURS: ${SESSION_STALE_REVIEW_HOURS:-12}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      PRODUCTION_MODE: ${PRODUCTION_MODE:-false}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_BLOCK_MINUTES: ${LOGIN_BLOCK_MINUTES:-15}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - restos_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  restos_postgres_data:
  restos_uploads:
