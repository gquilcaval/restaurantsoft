server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Las fotos llegan comprimidas desde el navegador; el backend rechaza más de 5 MB.
    client_max_body_size 6m;

    # La página se revisa en cada visita (así el celular recibe siempre la última versión);
    # los archivos con hash en el nombre nunca cambian y se guardan por un año.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El service worker y el manifiesto deben revisarse en cada visita para publicar actualizaciones.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
